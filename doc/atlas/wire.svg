<rect x="0" y="0" width="420" height="297" fill="#ffffff"/>
<text class="title" x="12.00" y="20.00">gestate — the wire, and both ends of it</text>
<text class="subtitle" x="12.00" y="26.50">Where a Python model meets a Rust window. Every word here is written twice, in two languages, and nothing but this compares them: the sheet is drawn from <tspan class="mono">abi.rs</tspan> and <tspan class="mono">editor.py</tspan>, from <tspan class="mono">session.furniture</tspan> and <tspan class="mono">Furniture::read</tspan>, from <tspan class="mono">Gesture::line</tspan> and</text>
<text class="subtitle" x="12.00" y="30.50"><tspan class="mono">session.act</tspan>.</text>
<text class="foot" x="12.00" y="287.00"><tspan class="mono">test_atlas.py</tspan> fails when the two ends disagree — a word sent and never read, a call declared with the wrong arity, a type that means something else on the other side. This is the one sheet that is a test as well as a picture.</text>
<text class="stamp" x="408.00" y="287.00">gestate 545d0fd · 2026-08-17+</text>
<rect class="lane" x="12.00" y="37.00" width="128.00" height="72.40" rx="2.4" style="fill:#eef3f7"/>
<text class="lanetitle" x="16.00" y="44.40">The model asks the window</text>
<text class="note" x="16.00" y="49.20">Text, chrome, pictures and orders, over a pointer and a string. Nothing is</text>
<text class="note" x="16.00" y="52.90">shared: every call hands over bytes.</text>
<rect class="chip" x="16.00" y="54.40" width="22.90" height="4.6" rx="1.2"/><text class="chiptext" x="27.45" y="57.60">ged_load_new</text><text class="extra" x="40.90" y="57.60">a file that is not on disk yet</text>
<rect class="chip" x="16.00" y="60.80" width="24.53" height="4.6" rx="1.2"/><text class="chiptext" x="28.27" y="64.00">ged_load_text</text><text class="extra" x="42.53" y="64.00">a different file, and the histories cleared</text>
<rect class="chip" x="16.00" y="67.20" width="18.03" height="4.6" rx="1.2"/><text class="chiptext" x="25.01" y="70.40">ged_order</text><text class="extra" x="36.03" y="70.40">do something — undo, goto, ask, insert</text>
<rect class="chip" x="16.00" y="73.60" width="31.03" height="4.6" rx="1.2"/><text class="chiptext" x="31.52" y="76.80">ged_set_furniture</text><text class="extra" x="49.03" y="76.80">the chrome: knobs, banks, boxes, the list</text>
<rect class="chip" x="16.00" y="80.00" width="27.78" height="4.6" rx="1.2"/><text class="chiptext" x="29.89" y="83.20">ged_set_picture</text><text class="extra" x="45.78" y="83.20">a canvas the model drew</text>
<rect class="chip" x="16.00" y="86.40" width="29.41" height="4.6" rx="1.2"/><text class="chiptext" x="30.70" y="89.60">ged_set_readings</text><text class="extra" x="47.41" y="89.60">what the walked canvas should read</text>
<rect class="chip" x="16.00" y="92.80" width="22.90" height="4.6" rx="1.2"/><text class="chiptext" x="27.45" y="96.00">ged_set_text</text><text class="extra" x="40.90" y="96.00">the document, replaced — one undo step</text>
<rect class="chip" x="16.00" y="99.20" width="22.90" height="4.6" rx="1.2"/><text class="chiptext" x="27.45" y="102.40">ged_set_walk</text><text class="extra" x="40.90" y="102.40">a substrate for the window to walk itself</text>
<rect class="lane" x="146.00" y="37.00" width="128.00" height="72.40" rx="2.4" style="fill:#eaf1ee"/>
<text class="lanetitle" x="150.00" y="44.40">The window answers</text>
<text class="note" x="150.00" y="49.20">Three questions and a drain — what the text is, whether it moved, where the</text>
<text class="note" x="150.00" y="52.90">caret is, and everything the hand did since last time.</text>
<rect class="chip" x="150.00" y="54.40" width="22.90" height="4.6" rx="1.2"/><text class="chiptext" x="161.45" y="57.60">ged_gestures</text><text class="extra" x="174.90" y="57.60">everything the hand did, drained</text>
<rect class="chip" x="150.00" y="60.80" width="14.78" height="4.6" rx="1.2"/><text class="chiptext" x="157.39" y="64.00">ged_pos</text><text class="extra" x="166.78" y="64.00">where the caret is</text>
<rect class="chip" x="150.00" y="67.20" width="16.40" height="4.6" rx="1.2"/><text class="chiptext" x="158.20" y="70.40">ged_text</text><text class="extra" x="168.40" y="70.40">the document as it stands</text>
<rect class="chip" x="150.00" y="73.60" width="21.28" height="4.6" rx="1.2"/><text class="chiptext" x="160.64" y="76.80">ged_version</text><text class="extra" x="173.28" y="76.80">has the text moved since last time</text>
<rect class="lane" x="280.00" y="37.00" width="128.00" height="72.40" rx="2.4" style="fill:#f6f2ea"/>
<text class="lanetitle" x="284.00" y="44.40">Opening and closing</text>
<text class="note" x="284.00" y="49.20">A window is a thread with a handle; the string it hands back is its own to</text>
<text class="note" x="284.00" y="52.90">free, which is the one rule a caller here has to keep.</text>
<rect class="chip" x="284.00" y="54.40" width="18.03" height="4.6" rx="1.2"/><text class="chiptext" x="293.01" y="57.60">ged_close</text><text class="extra" x="304.03" y="57.60">take it down and free it</text>
<rect class="chip" x="284.00" y="60.80" width="22.90" height="4.6" rx="1.2"/><text class="chiptext" x="295.45" y="64.00">ged_free_str</text><text class="extra" x="308.90" y="64.00">give back a string it handed over</text>
<rect class="chip" x="284.00" y="67.20" width="21.28" height="4.6" rx="1.2"/><text class="chiptext" x="294.64" y="70.40">ged_is_open</text><text class="extra" x="307.28" y="70.40">is it still there</text>
<rect class="chip" x="284.00" y="73.60" width="16.40" height="4.6" rx="1.2"/><text class="chiptext" x="292.20" y="76.80">ged_open</text><text class="extra" x="302.40" y="76.80">start the window on this text, at this size</text>
<rect class="chip" x="284.00" y="80.00" width="31.03" height="4.6" rx="1.2"/><text class="chiptext" x="299.52" y="83.20">ged_request_close</text><text class="extra" x="317.03" y="83.20">ask it to close</text>
<rect class="lane" x="12.00" y="120.40" width="128.00" height="143.90" rx="2.4" style="fill:#f3eef5"/>
<text class="lanetitle" x="16.00" y="127.80">Furniture — the chrome, as rows</text>
<text class="note" x="16.00" y="132.60"><tspan class="mono">session.furniture</tspan> builds it, <tspan class="mono">Furniture::read</tspan> takes it apart. A row the window</text>
<text class="note" x="16.00" y="136.30">does not know is dropped, never refused: a dropped line loses one knob, and a</text>
<text class="note" x="16.00" y="140.00">refusal loses the editor.</text>

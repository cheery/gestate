<text class="lanetitle" x="284.00" y="117.70">What the host asks a score</text>
<text class="note" x="284.00" y="122.50">No composer types these. They are here because the point of sorting the words</text>
<text class="note" x="284.00" y="126.20">is to say which are yours: a performer lays a score out, walks it, resumes it</text>
<text class="note" x="284.00" y="129.90">and reads its marks through this half.</text>

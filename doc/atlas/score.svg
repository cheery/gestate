<text class="title" x="12.00" y="20.00">gestate — the score, as a composer meets it</text>
<text class="subtitle" x="12.00" y="26.50">What <tspan class="mono">music.ges</tspan> gives you for writing a piece, sorted by what you are doing when you reach for it. Every signature here is the library's own line, read out of it — and the grey box is everything the <tspan font-weight="700">host</tspan> asks a score, which no composer types.</text>
<text class="foot" x="12.00" y="287.00">Names, signatures and types are read from <tspan class="mono">gestate/music.ges</tspan>; which group each belongs to is written in <tspan class="mono">gestate/atlas.py</tspan>, and a new score word fails <tspan class="mono">test_atlas.py</tspan> until it is placed.</text>
<text class="stamp" x="408.00" y="287.00">gestate 9bfe357 · 2026-08-16</text>
<rect class="lane" x="12.00" y="37.00" width="128.00" height="63.30" rx="2.4" style="fill:#f6f2ea"/>
<text class="lanetitle" x="16.00" y="44.40">A note, and a rest</text>
<text class="note" x="16.00" y="49.20">A note is a quoted value — <tspan class="mono">'(Key 60 100)</tspan> — and the score around it is these. <tspan class="mono">++</tspan></text>
<text class="note" x="16.00" y="52.90">is the prelude's, because a score is a semigroup like any other.</text>
<rect class="chip" x="16.00" y="54.40" width="8.28" height="4.6" rx="1.2"/><text class="chiptext" x="20.14" y="57.60">bar</text><text class="extra" x="26.28" y="57.60">bar : [: a :]</text>
<rect class="chip" x="16.00" y="60.80" width="19.65" height="4.6" rx="1.2"/><text class="chiptext" x="25.83" y="64.00">percussion</text><text class="extra" x="37.65" y="64.00">percussion : Int -&gt; [: b :]</text>
<rect class="chip" x="16.00" y="67.20" width="9.90" height="4.6" rx="1.2"/><text class="chiptext" x="20.95" y="70.40">prog</text><text class="extra" x="27.90" y="70.40">prog : Int -&gt; Int -&gt; [: b :]</text>
<rect class="chip" x="16.00" y="73.60" width="5.03" height="4.6" rx="1.2"/><text class="chiptext" x="18.51" y="76.80">r</text><text class="extra" x="23.03" y="76.80">r : [: a :]</text>
<rect class="chip" x="16.00" y="80.00" width="22.90" height="4.6" rx="1.2"/><text class="chiptext" x="27.45" y="83.20">ticksPerBeat</text><text class="extra" x="40.90" y="83.20">ticksPerBeat : Int</text>
<rect class="lane" x="146.00" y="37.00" width="128.00" height="63.30" rx="2.4" style="fill:#eef3f7"/>
<text class="lanetitle" x="150.00" y="44.40">Putting them together</text>
<text class="note" x="150.00" y="49.20"><tspan class="mono">||</tspan> is at the same time, <tspan class="mono">at</tspan> is a beat, and the four brackets shrink, stretch and</text>
<text class="note" x="150.00" y="52.90">clip. Every one of them is arithmetic you can check by hand, which is what a</text>
<text class="note" x="150.00" y="56.60">bar adding up to four beats means.</text>
<rect class="chip" x="150.00" y="58.10" width="6.65" height="4.6" rx="1.2"/><text class="chiptext" x="153.33" y="61.30">&gt;|</text><text class="extra" x="158.65" y="61.30">(&gt;|) : [: a :] -&gt; [: a :]</text>
<rect class="chip" x="150.00" y="64.50" width="6.65" height="4.6" rx="1.2"/><text class="chiptext" x="153.33" y="67.70">at</text><text class="extra" x="158.65" y="67.70">at : Int -&gt; [: a :] -&gt; [: a :]</text>

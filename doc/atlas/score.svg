<rect class="chip" x="16.00" y="134.10" width="9.90" height="4.6" rx="1.2"/><text class="chiptext" x="20.95" y="137.30">mark</text><text class="extra" x="27.90" y="137.30">mark : String -&gt; [: a :]</text>
<rect class="chip" x="16.00" y="140.50" width="14.78" height="4.6" rx="1.2"/><text class="chiptext" x="23.39" y="143.70">section</text><text class="extra" x="32.78" y="143.70">section : String -&gt; [: a :] -&gt; [: a :]</text>

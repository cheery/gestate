<rect class="chip" x="16.00" y="153.30" width="19.65" height="4.6" rx="1.2"/><text class="chiptext" x="25.83" y="156.50">tempoShape</text><text class="extra" x="37.65" y="156.50">tempoShape : List Tempo -&gt; [: a :] -&gt; [: a :]</text>
<rect class="lane" x="146.00" y="110.30" width="128.00" height="114.50" rx="2.4" style="fill:#f3eef5"/>
<text class="lanetitle" x="150.00" y="117.70">Chance, and listening</text>
<text class="note" x="150.00" y="122.50"><tspan class="mono">draw</tspan> is a zero-width leaf that reads the take's seed, <tspan class="mono">hear</tspan> one that reads a</text>
<text class="note" x="150.00" y="126.20">port — both lawful parts of the score monad rather than boxes beside it</text>
<text class="note" x="150.00" y="129.90">(<tspan class="mono">spec/ariadne.md</tspan>).</text>

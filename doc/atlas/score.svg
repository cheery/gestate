<rect class="chip" x="150.00" y="77.30" width="6.65" height="4.6" rx="1.2"/><text class="chiptext" x="153.33" y="80.50">|/</text><text class="extra" x="158.65" y="80.50">(|/) : [: a :] -&gt; Int -&gt; [: a :]</text>
<rect class="chip" x="150.00" y="83.70" width="6.65" height="4.6" rx="1.2"/><text class="chiptext" x="153.33" y="86.90">|&lt;</text><text class="extra" x="158.65" y="86.90">(|&lt;) : [: a :] -&gt; [: a :]</text>
<rect class="chip" x="150.00" y="90.10" width="6.65" height="4.6" rx="1.2"/><text class="chiptext" x="153.33" y="93.30">||</text><text class="extra" x="158.65" y="93.30">(||) : [: a :] -&gt; [: a :] -&gt; [: a :]</text>
<rect class="lane" x="280.00" y="37.00" width="128.00" height="63.30" rx="2.4" style="fill:#eef3f7"/>
<text class="lanetitle" x="284.00" y="44.40">Going on</text>
<text class="note" x="284.00" y="49.20">A score with no end is a value like any other: <tspan class="mono">cycle</tspan> and <tspan class="mono">unfold</tspan> make one, <tspan class="mono">long</tspan></text>
<text class="note" x="284.00" y="52.90">says how much of it to take, <tspan class="mono">sow</tspan> gives it a seed.</text>
<rect class="chip" x="284.00" y="54.40" width="11.53" height="4.6" rx="1.2"/><text class="chiptext" x="289.76" y="57.60">cycle</text><text class="extra" x="297.53" y="57.60">cycle : [: a :] -&gt; [: a :]</text>
<rect class="chip" x="284.00" y="60.80" width="9.90" height="4.6" rx="1.2"/><text class="chiptext" x="288.95" y="64.00">long</text><text class="extra" x="295.90" y="64.00">long : Int -&gt; [: a :] -&gt; [: a :]</text>
<rect class="chip" x="284.00" y="67.20" width="8.28" height="4.6" rx="1.2"/><text class="chiptext" x="288.14" y="70.40">sow</text><text class="extra" x="294.28" y="70.40">sow : Int -&gt; [: a :] -&gt; [: a :]</text>
<rect class="chip" x="284.00" y="73.60" width="13.15" height="4.6" rx="1.2"/><text class="chiptext" x="290.58" y="76.80">unfold</text><text class="extra" x="299.15" y="76.80">unfold : b -&gt; (b -&gt; ([: a :], b)) -&gt; [: a :]</text>
<rect class="lane" x="12.00" y="110.30" width="128.00" height="114.50" rx="2.4" style="fill:#f3eef5"/>
<text class="lanetitle" x="16.00" y="117.70">Time, and places in it</text>
<text class="note" x="16.00" y="122.50">The tempo is a shape along the path, not a number; a <tspan class="mono">mark</tspan> names a place a</text>
<text class="note" x="16.00" y="126.20">rehearsal can jump to, and a <tspan class="mono">fermata</tspan> waits for a hand.</text>

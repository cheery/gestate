<text class="lanetitle" x="16.00" y="242.20">The types, and what they can do</text>
<text class="note" x="16.00" y="247.00">A score is <tspan class="mono">[: a :]</tspan>; the instances say what that means — a semigroup, a monad, and reversible.</text>

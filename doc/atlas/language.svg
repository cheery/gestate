<text class="title" x="12.00" y="20.00">gestate — from text to a program</text>
<text class="subtitle" x="12.00" y="26.50">The front end, in the order it runs. The order is not written down here: <tspan class="mono">pipeline._analyse</tspan> is read for it, and the sheet fails when the two disagree. Where each pass lives, and what it can refuse, are read the same way.</text>
<text class="foot" x="12.00" y="287.00">Pass order, homes, refusals and the instruction set are all read from the source by <tspan class="mono">gestate/atlas.py</tspan>; the sentence under each name is the only written part. <tspan class="mono">test_atlas.py</tspan> fails when the sheet and the source disagree — then run</text>
<text class="stamp" x="408.00" y="287.00">gestate 993f250 · 2026-09-05+</text>
<rect class="lane" x="12.00" y="37.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="16.00" y="43.60">01</text>
<text class="step mono" x="23.00" y="43.60">_merge_prelude</text>
<text class="home mono" x="102.50" y="43.60">prelude.merge</text>
<text class="note" x="16.00" y="48.60">The libraries go in front of your file, and a seam is</text>
<text class="note" x="16.00" y="52.30">left where yours begins so a rebuild can skip theirs.</text>
<text class="refuses" x="16.00" y="75.60">refuses with FixityError</text>
<rect class="lane" x="112.50" y="37.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="116.50" y="43.60">02</text>
<text class="step mono" x="123.50" y="43.60">parse</text>
<text class="home mono" x="203.00" y="43.60">syntax</text>
<text class="note" x="116.50" y="48.60">Tokens, layout by indentation, a module of declarations.</text>
<text class="refuses" x="116.50" y="75.60">refuses with FixityError</text>
<rect class="lane" x="213.00" y="37.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="217.00" y="43.60">03</text>
<text class="step mono" x="224.00" y="43.60">classify</text>
<text class="home mono" x="303.50" y="43.60">declarations</text>
<text class="note" x="217.00" y="48.60">Declarations sorted into what they are: data, classes,</text>
<text class="note" x="217.00" y="52.30">instances, signatures, definitions.</text>
<text class="refuses" x="217.00" y="75.60">refuses with CoherenceError, DeclError, DeriveError</text>
<rect class="lane" x="313.50" y="37.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="317.50" y="43.60">04</text>
<text class="step mono" x="324.50" y="43.60">check_program</text>
<text class="home mono" x="404.00" y="43.60">exhaust</text>
<text class="note" x="317.50" y="48.60">Every <tspan class="mono">case</tspan> covers its type — checked on the surface</text>
<text class="note" x="317.50" y="52.30">patterns, before the match compiler makes them complete</text>
<text class="note" x="317.50" y="56.00">by construction.</text>
<text class="refuses" x="317.50" y="75.60">refuses with ExhaustError</text>
<rect class="lane" x="313.50" y="88.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="317.50" y="94.60">05</text>
<text class="step mono" x="324.50" y="94.60">desugar_program</text>
<text class="home mono" x="404.00" y="94.60">desugar</text>
<text class="note" x="317.50" y="99.60">Patterns compiled to decision trees, sugar gone: what</text>
<text class="note" x="317.50" y="103.30">comes out is supercombinators, which is what the machine</text>
<text class="note" x="317.50" y="107.00">runs.</text>
<text class="refuses" x="317.50" y="126.60">refuses with DeclError, DesugarError</text>
<rect class="lane" x="213.00" y="88.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="217.00" y="94.60">06</text>
<text class="step mono" x="224.00" y="94.60">_kind_check_program</text>
<text class="home mono" x="303.50" y="94.60">pipeline</text>
<text class="note" x="217.00" y="99.60">The types of types: <tspan class="mono">Maybe Maybe</tspan> is refused here, and so</text>
<text class="note" x="217.00" y="103.30">is a signature variable wearing a type's name in</text>
<text class="note" x="217.00" y="107.00">lowercase.</text>
<text class="refuses" x="217.00" y="126.60">refuses with DeclError, KindError</text>
<rect class="lane" x="112.50" y="88.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="116.50" y="94.60">07</text>
<text class="step mono" x="123.50" y="94.60">infer_program</text>
<text class="home mono" x="203.00" y="94.60">infer</text>
<text class="note" x="116.50" y="99.60">Inference, classes and instances, and the signature as a</text>
<text class="note" x="116.50" y="103.30">contract — its variables are the caller's to choose.</text>
<text class="refuses" x="116.50" y="126.60">refuses with InferError, UnresolvedName</text>
<rect class="lane" x="12.00" y="88.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="16.00" y="94.60">08</text>
<text class="step mono" x="23.00" y="94.60">lower_fields</text>
<text class="home mono" x="102.50" y="94.60">desugar</text>
<text class="note" x="16.00" y="99.60"><tspan class="mono">e.N</tspan> resolved from the type of what it selects, before any</text>
<text class="note" x="16.00" y="103.30">later pass has to know the node exists.</text>
<text class="refuses" x="16.00" y="126.60">refuses with DesugarError</text>
<rect class="lane" x="12.00" y="139.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="16.00" y="145.60">09</text>
<text class="step mono" x="23.00" y="145.60">check_monotone</text>
<text class="home mono" x="102.50" y="145.60">monotone.check_scs</text>
<text class="note" x="16.00" y="150.60">Datafun's discipline: what may vary monotonically and</text>
<text class="note" x="16.00" y="154.30">what must be discrete, read off the binders inference</text>
<text class="note" x="16.00" y="158.00">just annotated.</text>
<text class="refuses" x="16.00" y="177.60">refuses with MonotoneError</text>
<rect class="lane" x="112.50" y="139.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="116.50" y="145.60">10</text>
<text class="step mono" x="123.50" y="145.60">check_subgrammars</text>
<text class="home mono" x="203.00" y="145.60">subgrammar.check_scs</text>
<text class="note" x="116.50" y="150.60">The two fragments — Datafun's, and audio's first-order</text>
<text class="note" x="116.50" y="154.30">one — each a refusal with the author's own sentence</text>
<text class="note" x="116.50" y="158.00">attached.</text>
<text class="refuses" x="116.50" y="177.60">refuses with SubgrammarError</text>
<rect class="lane" x="213.00" y="139.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="217.00" y="145.60">11</text>
<text class="step mono" x="224.00" y="145.60">_discharge</text>
<text class="home mono" x="303.50" y="145.60">pipeline</text>
<text class="note" x="217.00" y="150.60">Dictionaries chosen and passed: elaboration rebuilds the</text>
<text class="note" x="217.00" y="154.30">lambdas, specialisation makes a copy per instance where</text>
<text class="note" x="217.00" y="158.00">it pays.</text>
<text class="refuses" x="217.00" y="177.60">refuses with ConstraintError, ElaborateError</text>
<rect class="lane" x="313.50" y="139.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="317.50" y="145.60">12</text>
<text class="step mono" x="324.50" y="145.60">resolve_static_methods</text>
<text class="home mono" x="404.00" y="145.60">elaborate</text>
<text class="note" x="317.50" y="150.60">A class method with no dictionary to take it from,</text>
<text class="note" x="317.50" y="154.30">answered by the type it was used at.</text>
<rect class="lane" x="313.50" y="190.00" width="94.50" height="42.00" rx="2.2" style="fill:#f4f7f9"/>
<text class="stepnum" x="317.50" y="196.60">13</text>
<text class="step mono" x="324.50" y="196.60">expand_envelopes</text>
<text class="home mono" x="404.00" y="196.60">envexpand.expand</text>
<text class="note" x="317.50" y="201.60">The last rewrite before the machine, and the one the</text>
<text class="note" x="317.50" y="205.30">audio side asked for.</text>

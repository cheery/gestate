<rect class="lane" x="313.50" y="37.00" width="94.50" height="81.70" rx="2.4" style="fill:#eaf1ee"/>
<text class="lanetitle" x="317.50" y="44.40">C, then machine code</text>
<text class="note" x="317.50" y="49.20"><tspan class="mono">audioir</tspan> lowers the graph to these eight kinds, <tspan class="mono">audiollvm</tspan></text>
<text class="note" x="317.50" y="52.90">writes LLVM IR, <tspan class="mono">clang</tspan> makes a <tspan class="mono">.so</tspan>. The objects are</text>
<text class="note" x="317.50" y="56.60">bit-identical at <tspan class="mono">-O1</tspan> and <tspan class="mono">-O2</tspan>; the choice is measured in</text>
<text class="note" x="317.50" y="60.30"><tspan class="mono">roadmap.md</tspan>.</text>
<rect class="chip" x="317.50" y="65.40" width="9.90" height="4.6" rx="1.2"/><text class="chiptext" x="322.45" y="68.60">Call</text>
<rect class="chip" x="329.00" y="65.40" width="9.90" height="4.6" rx="1.2"/><text class="chiptext" x="333.95" y="68.60">Case</text>
<rect class="chip" x="340.50" y="65.40" width="8.28" height="4.6" rx="1.2"/><text class="chiptext" x="344.64" y="68.60">Con</text>
<rect class="chip" x="350.38" y="65.40" width="11.53" height="4.6" rx="1.2"/><text class="chiptext" x="356.14" y="68.60">Const</text>
<rect class="chip" x="363.51" y="65.40" width="11.53" height="4.6" rx="1.2"/><text class="chiptext" x="369.27" y="68.60">Field</text>
<rect class="chip" x="376.63" y="65.40" width="8.28" height="4.6" rx="1.2"/><text class="chiptext" x="380.77" y="68.60">Let</text>
<rect class="chip" x="386.51" y="65.40" width="9.90" height="4.6" rx="1.2"/><text class="chiptext" x="391.46" y="68.60">Prim</text>
<rect class="chip" x="317.50" y="71.00" width="8.28" height="4.6" rx="1.2"/><text class="chiptext" x="321.64" y="74.20">Var</text>
<rect class="lane" x="12.00" y="129.70" width="128.00" height="33.90" rx="2.4" style="fill:#f3eef5"/>
<text class="lanetitle" x="16.00" y="137.10">The score, walked</text>
<text class="note" x="16.00" y="141.90"><tspan class="mono">audioscore</tspan> performs <tspan class="mono">score</tspan> into notes at ticks — baked ahead when the walk can</text>
<text class="note" x="16.00" y="145.60">be trusted to end, and performed as it plays when it cannot.</text>
<rect class="lane" x="146.00" y="129.70" width="128.00" height="33.90" rx="2.4" style="fill:#f3eef5"/>
<text class="lanetitle" x="150.00" y="137.10">A step function per channel</text>
<text class="note" x="150.00" y="141.90"><tspan class="mono">audioschedule</tspan> turns notes into control changes at sample positions, <tspan class="mono">audioalloc</tspan></text>
<text class="note" x="150.00" y="145.60">decides which voice takes a note and which one is stolen.</text>
<rect class="lane" x="280.00" y="129.70" width="128.00" height="33.90" rx="2.4" style="fill:#f3eef5"/>
<text class="lanetitle" x="284.00" y="137.10">Voices</text>
<text class="note" x="284.00" y="141.90"><tspan class="mono">audiovoices</tspan> — <tspan class="mono">voices bass 2 bassVoice</tspan> is two copies of one instrument, each</text>
<text class="note" x="284.00" y="145.60">with its own channels, named lexically so the checker can say whether the piece</text>
<text class="note" x="284.00" y="149.30">fits the instrument.</text>
<rect class="lane" x="12.00" y="174.60" width="195.00" height="74.40" rx="2.4" style="fill:#f7f0ea"/>
<text class="lanetitle" x="16.00" y="182.00">The engine</text>
<text class="note" x="16.00" y="186.80"><tspan class="mono">audioengine</tspan> fills a buffer from the compiled graph and <tspan class="mono">audiolive</tspan> installs an edit under the sound without stopping it — the</text>
<text class="note" x="16.00" y="190.50">phase of an oscillator survives if its node's origin does.</text>
<rect class="lane" x="213.00" y="174.60" width="195.00" height="74.40" rx="2.4" style="fill:#f7f0ea"/>
<text class="lanetitle" x="217.00" y="182.00">The C host, and the second wire</text>
<text class="note" x="217.00" y="186.80"><tspan class="mono">host.c</tspan> owns the callback and the ring; <tspan class="mono">audiohost</tspan> reaches it through <tspan class="mono">ctypes</tspan>. Both ends read, the same way the editor's wire</text>
<text class="note" x="217.00" y="190.50">is.</text>

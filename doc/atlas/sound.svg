<text class="lanetitle" x="116.50" y="44.40">The fragment leaves the interpreter</text>
<text class="note" x="116.50" y="49.20"><tspan class="mono">audioextract</tspan> walks what <tspan class="mono">sound</tspan> reaches and refuses what</text>
<text class="note" x="116.50" y="52.90">cannot be flat: no lists at audio rate, no closures,</text>
<text class="note" x="116.50" y="56.60">first order only. A refusal names the line and says why.</text>
<rect class="chip" x="116.50" y="61.70" width="22.90" height="4.6" rx="1.2"/><text class="chiptext" x="127.95" y="64.90">ExtractError</text>
<rect class="lane" x="213.00" y="37.00" width="94.50" height="81.70" rx="2.4" style="fill:#eef3f7"/>
<text class="lanetitle" x="217.00" y="44.40">A graph of nodes</text>
<text class="note" x="217.00" y="49.20"><tspan class="mono">audiograph</tspan> — one node per operation, control channels</text>
<text class="note" x="217.00" y="52.90">where a knob or a schedule writes, and this arithmetic</text>
<text class="note" x="217.00" y="56.60">and no more.</text>

<text class="title" x="12.00" y="20.00">gestate — from a signal to a sound card</text>
<text class="subtitle" x="12.00" y="26.50">The audio backend, both halves: what the language describes is compiled to machine code, and what the score says arrives as control values on the same graph. The vocabularies below are read from the compiler's own tables — the formers, the</text>
<text class="subtitle" x="12.00" y="30.50">primitives, the IR's kinds, and the C host's exports.</text>
<text class="foot" x="12.00" y="287.00"><tspan class="mono">test_atlas.py</tspan> fails when the sheet is not what the source renders, and when Python names a <tspan class="mono">host.c</tspan> function that is not there. Redraw with <tspan class="mono">python -m gestate.atlas</tspan>.</text>
<text class="stamp" x="408.00" y="287.00">gestate db44d4f · 2026-08-16+</text>
<rect class="lane" x="12.00" y="37.00" width="94.50" height="81.70" rx="2.4" style="fill:#f6f2ea"/>
<text class="lanetitle" x="16.00" y="44.40">What you write</text>
<text class="note" x="16.00" y="49.20"><tspan class="mono">sound : Sig Float</tspan>, built from these and nothing else.</text>
<text class="note" x="16.00" y="52.90"><tspan font-weight="700">Every one is a fold over time</tspan>: an oscillator, an</text>
<text class="note" x="16.00" y="56.60">envelope, a filter and a noise source are all <tspan class="mono">scan</tspan>,</text>
<text class="note" x="16.00" y="60.30">written by the programmer rather than wired from a fixed</text>
<text class="note" x="16.00" y="64.00">set.</text>
<rect class="chip" x="16.00" y="69.10" width="34.28" height="4.6" rx="1.2"/><text class="chiptext" x="33.14" y="72.30">__Functor_Sig_map__</text>

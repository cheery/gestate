<text class="title" x="12.00" y="20.00">gestate — the whole thing on one sheet</text>
<text class="subtitle" x="12.00" y="26.50">A language that describes music, pictures and sound, and the host that performs what it describes.  Generated by <tspan class="mono">python -m gestate.atlas</tspan> — every box is a file that exists and every arrow an import that is there.</text>
<text class="foot" x="12.00" y="287.00">Lanes and spine are declared in <tspan class="mono">gestate/atlas.py</tspan>; modules, libraries and crates are read from the tree.  <tspan class="mono">test_atlas.py</tspan> fails when this sheet is not what the source renders — then run the command above.</text>
<rect class="lane" x="12.00" y="33.00" width="94.50" height="90.00" rx="2.4" style="fill:#f6f2ea"/>
<text class="lanetitle" x="16.00" y="40.40">What you write</text>
<text class="note" x="16.00" y="45.20">A <tspan class="mono">.ges</tspan> file and the libraries in scope for it — each</text>
<text class="note" x="16.00" y="48.90">backend looks for one declaration. The two below read</text>
<text class="note" x="16.00" y="52.60">this tree and write it back out: <tspan class="mono">doc/ref/</tspan>, and this</text>
<text class="note" x="16.00" y="56.30">sheet.</text>

# Pytest configuration.
#
# Deliberately small: one marker and two warning filters.

[pytest]

# ── The slow half, so it can be left out ─────────────────────────────────
#
#     pytest test/ -m "not golden"     # everything else — fast, portable
#     pytest test/ -m golden           # only the oracles
#
# A golden test re-renders an example through the **interpreter** and
# compares it sample for sample.  That is minutes rather than
# milliseconds, and it is the only part of the suite that is a claim about
# *one machine*: bit-exactness through `sin` and `exp` holds where the
# buffer was made and nowhere else, which is what the `libm` header in each
# `.samples` file is for.  Everything outside this marker is
# machine-independent.
markers =
    golden: re-renders a committed buffer and compares it exactly

# ── Two warnings from importing pygame, neither of them ours ─────────────
#
# `pygame/pkgdata.py` imports `pkg_resources`, which setuptools has
# deprecated, and `pkg_resources` in turn complains about a namespace
# package registered by something else in the environment entirely.  Both
# arrive the moment pygame is imported and nothing in this repository can
# stop either; they will go when pygame ships a version that does not
# reach for `pkg_resources`.
#
# Matched by **message**, not by category or module, so exactly these two
# sentences are silenced.  A `DeprecationWarning` filter would have hidden
# every future one the standard library raises about this code, which is
# the class of warning most worth reading.
# ── And one that is a failure wearing a warning ───────────────────────────
#
# A thread that dies under a test is pytest's
# `PytestUnhandledThreadExceptionWarning`, and the test it died under
# still passes.  The housekeeping thread died that way in every full run
# from 2026-08-17 to 2026-08-26 — nine days as *"1 warning"* in a totals
# line, named by nothing (`fixme.md` F184).  This editor runs its sound
# on threads; one of them dying is exactly what the suite is for.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
    ignore:pkg_resources is deprecated as an API:DeprecationWarning
    ignore:Deprecated call to .pkg_resources\.declare_namespace:DeprecationWarning

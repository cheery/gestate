[package]
name = "gestate-clap"
version = "0.1.0"
edition = "2021"
description = "The CLAP shell: a host shim around one compiled gestate graph."
license = "MIT"

[lib]
# `cdylib`: a plain shared object (.so/.dylib/.dll) exposing only the
# `#[no_mangle] extern "C"` symbols — which is what a CLAP host dlopens
# and probes for `clap_entry`.  `rlib` beside it so `cargo test` can
# link the crate into test binaries; the host never sees that one.
crate-type = ["cdylib", "rlib"]

# No dependencies, deliberately.  CLAP is a stable C ABI and the subset a
# generated synth needs is small; `src/abi.rs` declares exactly that
# subset, so the shell builds offline and owns every line it ships.
[dependencies]
# Only under `gui` — `spec/panel.md` §"Windowing: baseview" isolates
# every dependency this design needs in `shell/panel`, so the build a
# host loads without a face is the zero-dependency shell it always was.
gestate-panel = { path = "../panel", features = ["window"], optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
# Off: the factory reports zero plugins — an empty shell that loads
# cleanly in a host, which is what CI can build without a graph.
# On: `src/descriptor.rs` (written by `python -m gestate.export`) and the
# graph's object file (linked via build.rs) turn it into an instrument.
engine = []
# The plugin's own window (`spec/panel.md`).  Off by default: a plugin
# without it is byte-for-byte the one that shipped before, which is
# acceptance 1.
gui = ["dep:gestate-panel", "dep:raw-window-handle"]

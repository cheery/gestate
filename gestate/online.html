<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}</title>
<style>
  body { margin: 2rem auto; max-width: 48rem; padding: 0 1rem;
         font: 16px/1.5 system-ui, sans-serif; color: #222; background: #fafaf7; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }
  h1 code { font-weight: 600; }
  .bar { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
  button { font: inherit; padding: .4rem 1.2rem; border: 1px solid #888;
           border-radius: 4px; background: #fff; cursor: pointer; }
  button:disabled { color: #999; cursor: default; }
  #status { color: #555; }
  pre { background: #fff; border: 1px solid #ddd; border-radius: 4px;
        padding: 1rem; overflow-x: auto; font: 14px/1.4 ui-monospace, monospace; }
  #check { display: none; }
  footer { margin-top: 2rem; color: #777; font-size: .9rem; }
</style>
</head>
<body data-stem="{{stem}}">
<h1><code>{{name}}</code></h1>
<div class="bar">
  <button id="play" disabled>play</button>
  <span id="status">loading…</span>
</div>
<pre id="source">{{source}}</pre>
<pre id="check"></pre>
<footer>The sound is computed in this tab — <a href="https://github.com/cheery/gestate">gestate</a>.</footer>
<script src="player.js"></script>
</body>
</html>

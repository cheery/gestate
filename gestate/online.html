<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{name}}</title>
<style>
  body { margin: 2rem auto; max-width: 48rem; padding: 0 1rem;
         font: 16px/1.5 system-ui, sans-serif; color: #222; background: #fafaf7; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 1rem; }
  h1 code { font-weight: 600; }
  .bar { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; }
  button { font: inherit; padding: .4rem 1.2rem; border: 1px solid #888;
           border-radius: 4px; background: #fff; cursor: pointer; }
  button:disabled { color: #999; cursor: default; }
  #status { color: #555; }
  pre, .src { background: #fff; border: 1px solid #ddd; border-radius: 4px;
        padding: 1rem; overflow-x: auto; font: 14px/1.4 ui-monospace, monospace; }
  .ln { white-space: pre; display: flex; align-items: center; gap: 0 1rem; }
  /* Sticky to the visible right edge: the block scrolls sideways when a
     comment line is wider than the window, and a knob sat at the end
     of the *content* was off-screen (Henri, 2026-08-30). */
  .knob { display: inline-flex; align-items: center; gap: .4rem; margin-left: auto;
          padding: 0 .2rem 0 1rem; font: 13px system-ui, sans-serif; color: #555;
          white-space: nowrap; position: sticky; right: 0; background: #fff; }
  .knob input { width: 7rem; }
  /* Narrower than the declaration plus its knob: the knob takes the
     next row, under the line, and sticks to the left edge instead. */
  @media (max-width: 40rem) {
    .ln { flex-wrap: wrap; }
    .knob { flex-basis: 100%; margin-left: 0; justify-content: flex-start;
            padding-left: 1.5rem; right: auto; left: 0; }
  }
  .knob output { min-width: 3rem; text-align: right; font: 13px ui-monospace, monospace; color: #222; }
  .note { color: #555; font-size: .95rem; margin: 0 0 1rem;
          border-left: 3px solid #ddd; padding-left: .8rem; }
  #check { display: none; }
  /* The picture is sized by the substrate, not by the page: the walk
     places its own origin at the canvas centre and a page that scaled
     it would be drawing a different picture from the plugin. */
  #picture { display: block; background: {{ground}}; border: 1px solid #ddd;
             border-radius: 4px; margin-bottom: 1rem; touch-action: none;
             max-width: 100%; }
  footer { margin-top: 2rem; color: #777; font-size: .9rem; }
</style>
</head>
<body data-stem="{{stem}}">
<h1><code>{{name}}</code></h1>
<div class="bar">
  <button id="play" disabled>play</button>
  <span id="status">loading…</span>
</div>
<p id="unfolds" class="note" hidden></p>
<p id="nopicture" class="note" hidden></p>
<canvas id="picture" width="{{cw}}" height="{{ch}}" hidden></canvas>
<div id="source" class="src">{{source}}</div>
<pre id="check"></pre>
<footer>{{up}}The sound is computed in this tab — <a href="https://github.com/cheery/gestate">gestate</a>.</footer>
<script type="module" src="player.js"></script>
</body>
</html>
